[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "restaurant-social-automation"
version = "1.0.0"
description = "AI-powered restaurant poster enhancement & Facebook posting pipeline"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
restaurant-auto = "api.app:main"

[tool.setuptools.packages.find]
include = ["api*", "modules*", "workflow*", "utils*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
